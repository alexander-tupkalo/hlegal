<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    
  <script type="module" crossorigin src="/assets/main-5c700405.js"></script>
  <link rel="stylesheet" href="/assets/main-36486396.css">
</head>
<body>

    <main class="contact-page">
    <section class="contact">
        <div class="container">
            <div class="contact__wrapper">

                <a href="index.html"
                   class="contact__close"
                   aria-label="Close page">
                    <span></span>
                    <span></span>
                </a>

                <form class="contact-form">
                    <h1 class="contact-form__title">
                        We would like to help you
                    </h1>

                    <input
                        class="contact-form__input"
                        type="text"
                        placeholder="Name"
                        required
                    >

                    <textarea
                        class="contact-form__textarea"
                        placeholder="Message"
                        required
                    ></textarea>

                    <h2 class="contact-form__subtitle">
                        How to answer you?
                    </h2>

                    <input
                        class="contact-form__input"
                        type="tel"
                        placeholder="Phone number"
                    >

                    <input
                        class="contact-form__input"
                        type="email"
                        placeholder="Email"
                        required
                    >

                    <button
                        class="contact-form__button"
                        type="submit"
                    >
                        Send message
                    </button>
                </form>

            </div>
        </div>
    </section>
</main>
    


</body>
</html>
